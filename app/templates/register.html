{% extends "base.html" %}

{% block title %}Register Account — WebinarAI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-auto py-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- Header Banner -->
            <div class="bg-primary bg-gradient text-white p-4 text-center">
                <div class="display-6 mb-2">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h4 class="fw-bold mb-1">Create an Account</h4>
                <p class="small text-white-50 mb-0">Join WebinarAI for automated summarization & knowledge distribution</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form action="{{ url_for('auth.register') }}" method="POST" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Choose a username" value="{{ username or '' }}" required autofocus>
                        </div>
                        <div class="form-text text-muted" style="font-size: 0.75rem;">3-50 characters; letters, numbers, and underscores only.</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-secondary small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="student@university.edu" value="{{ email or '' }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="At least 6 characters" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold text-secondary small">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check2-circle"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                        <span>Register & Get Started</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <!-- Navigation link to login -->
                <div class="mt-4 pt-3 border-top text-center">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-primary text-decoration-none ms-1">
                        Sign In <i class="bi bi-arrow-up-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
